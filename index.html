<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Ddooby-Block</title>
    <!-- 아이콘은 아직 없다. 빈 data URL로 브라우저의 /favicon.ico 요청(404 콘솔 오류)을 막는다 -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      html {
        /* 캔버스 밖 여백(안전 영역)의 색. Phaser 캔버스 기본 배경과 같은 검정 */
        background: #000000;
      }
      #game {
        /* 노치·내비게이션 바를 피한다. padding이 아니라 요소 크기 자체를 안전 영역 안쪽으로 둔다
           (Phaser는 부모 clientHeight로 캔버스를 만드는데 padding이 포함돼 안전 영역만큼 밀려 나간다) */
        position: fixed;
        top: env(safe-area-inset-top);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
